name: Game Center sync

# Manual only. Dry run by default; set apply=true to create the missing achievements in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create the missing achievements (false = dry run)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gamecenter:
    runs-on: ubuntu-latest
    environment: testflight
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Sync achievements
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then ruby scripts/gc-sync.rb --apply; else ruby scripts/gc-sync.rb; fi
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
