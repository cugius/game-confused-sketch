name: Game Center sync

# Manual only. Dry run by default; apply=true reconciles achievements, leaderboards, locales and images.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Sync catalog and images (false = dry run)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gamecenter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: testflight
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sync tools
        run: python -m pip install Pillow requests PyJWT cryptography
      - name: Validate the local catalog and images
        run: python scripts/gc-sync.py --validate-only
      - name: Prepare the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Sync achievements, leaderboards and localized images
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then python scripts/gc-sync.py --apply; else python scripts/gc-sync.py; fi
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
