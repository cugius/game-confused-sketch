name: iOS TestFlight upload

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-testflight.yml']
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version shown to testers (CFBundleShortVersionString), e.g. 0.57.0'
        required: true
        default: '0.57.0'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  appstore-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testflight
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check access to the Apple app before using macOS minutes
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          umask 077
          export ASC_KEY_PATH="$RUNNER_TEMP/appstore-preflight.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          ruby scripts/check-appstore.rb

  testflight:
    needs: appstore-access
    runs-on: macos-15
    timeout-minutes: 45
    environment: testflight
    # Uploads only ever come from main, even if someone dispatches the workflow from another branch.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned by SHA
        with:
          persist-credentials: false

      - name: Validate the version input
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version || '0.57.0' }}
        run: |
          [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "marketing_version must look like 0.1.1"; exit 1; }

      - name: Check that the secrets are configured
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the testflight environment (see ios/TESTFLIGHT.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Check game and generate project
        run: |
          node tests/check.cjs
          python3 scripts/sync-ios.py
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml

      # App Store Connect rejects uploads built with an SDK older than iOS 26 ("SDK version issue"), and the runner's
      # default Xcode is 16.4. Select the newest installed Xcode 26.x (installed side by side on the macos-15 image).
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 found on this runner. App Store Connect requires the iOS 26 SDK; try runs-on: macos-26."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS 26" || { echo "::error::iOS 26 SDK not available"; exit 1; }

      - name: Prepare the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Verify App Store Connect app access
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ruby scripts/check-appstore.rb

      # The archive is built without signing on purpose: an automatically signed archive asks for an iOS Development
      # profile, which needs at least one registered device ("Your team has no devices..."). The export step below
      # signs with an Apple Distribution certificate and an App Store profile created through the API key.
      - name: Archive (Release, unsigned)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '0.57.0' }}
          # TestFlight needs a build number that is unique and increasing for each marketing version.
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project ios/ConfusedSketch.xcodeproj -scheme ConfusedSketch -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ConfusedSketch.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee build/archive.log

      # The archive is unsigned, so the entitlements file never reaches the binary and GameKit stays silent on device
      # Sign ad hoc with the entitlements; the export
      # replaces this signature with the distribution one and keeps the entitlements.
      - name: Ad-hoc sign with entitlements
        shell: bash
        run: |
          APP=build/ConfusedSketch.xcarchive/Products/Applications/ConfusedSketch.app
          codesign --force --sign - --entitlements ios/ConfusedSketch/ConfusedSketch.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>&1 | grep -q game-center || { echo "::error::Game Center entitlement missing from the archive"; exit 1; }

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ConfusedSketch.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/export.log

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: confused-sketch-testflight-${{ github.run_number }}
          path: |
            build/archive.log
            build/export.log
          if-no-files-found: warn
          retention-days: 7
