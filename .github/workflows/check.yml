name: Game checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check.cjs
      - run: node tests/balance.cjs
      - run: python3 scripts/sync-ios.py
      - name: Validate wrapper resources
        run: python3 scripts/check-ios.py
      - uses: actions/upload-artifact@v4
        with:
          name: confused-sketch-html
          path: dist/index.html
