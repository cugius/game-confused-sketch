function clearTower(t){t.type=null;t.level=1;t.hp=0;t.maxhp=0;t.destroyed=false;t.branch=null;t.priority='first';t.cooldown=0;t.damageFlash=0}
function defenseOpacity(t){ensureTowerHealth(t);return t.type?.25+.75*t.hp/t.maxhp:1}

function towerMaxHP(t){return ({triangle:110,spiral:100,mortar:140,sniper:95,mender:120,pentagon:115,star:105,octagon:175,lab:180}[t.type]||0)+Math.max(0,(t.level||1)-1)*45}
function ensureTowerHealth(t){if(!t?.type)return;let max=towerMaxHP(t);if(!Number.isFinite(t.hp))t.hp=max;else if(Number.isFinite(t.maxhp)&&t.maxhp!==max&&!t.destroyed)t.hp+=max-t.maxhp;t.maxhp=max;t.hp=Math.max(0,Math.min(max,t.hp));if(t.hp<=0)t.destroyed=true;else t.destroyed=!!t.destroyed}
function towerOperational(t){if(!t?.type)return false;ensureTowerHealth(t);return t.hp>0&&!t.destroyed}
function towerRepairCost(t){ensureTowerHealth(t);return Math.ceil(Math.max(0,t.maxhp-t.hp)*.24*paperProfile().repair)}
function towerRepairButton(i){let t=towers[i];if(!t?.type)return '';ensureTowerHealth(t);let cost=towerRepairCost(t);return `<div class="tower-integrity"><b>Integrità ${Math.ceil(t.hp)} / ${t.maxhp}${t.destroyed?' · ABBATTUTA':''}</b><progress aria-label="Integrità della difesa" max="${t.maxhp}" value="${t.hp}"></progress></div>${cost?`<button class="btn ${t.destroyed?'green':'light'}" ${ink<cost?'disabled':''} onclick="repairTower(${i})">Ripara · ${cost}✎</button>${ink<cost?'<span class="lock-reason">Grafite insufficiente</span>':''}`:'<p>Difesa integra</p>'}`}

function damagedDefenses(){return towers.map((t,i)=>({t,i})).filter(({t})=>t?.type&&(ensureTowerHealth(t),t.hp<t.maxhp)).sort((a,b)=>a.t.hp/a.t.maxhp-b.t.hp/b.t.maxhp)}
function repairAllCost(){return damagedDefenses().reduce((a,{t})=>a+towerRepairCost(t),0)}
function repairAll(){if(gameMode==='erasers'||!started||over)return 0;let fixed=0,spent=0,left=0;for(let {t,i} of damagedDefenses()){let cost=towerRepairCost(t);if(!cost)continue;if(ink<cost){left++;continue}ink-=cost;spent+=cost;t.hp=t.maxhp;t.destroyed=false;t.damageFlash=0;upgradeFx(i);fixed++}if(!fixed){toast(left?'Serve più grafite.':'Tutte le difese sono integre.');return 0}saveRun();ui();sfx('repair');hapticFor('complete');toast(fixed===1?'1 difesa ripristinata · '+spent+'✎':fixed+' difese ripristinate · '+spent+'✎'+(left?' · '+left+' da curare con più grafite':''));if(panelCurrent?.name==='tower')towerDetails();else if(panelCurrent?.name==='lab')labMenu('maintenance','defenses');return fixed}
function repairAllButton(){let n=damagedDefenses().length;if(n<2||gameMode==='erasers')return '';let cost=repairAllCost();return `<button class="btn green" ${ink<1?'disabled':''} onclick="repairAll()">Cura tutto · ${cost}✎<small> ${n} difese</small></button>`+(ink<cost?'<span class="lock-reason">Grafite insufficiente per tutte: curo prima le più danneggiate.</span>':'')}
function repairTower(i){let t=towers[i];if(gameMode==='erasers'||!started||over||!t?.type)return false;ensureTowerHealth(t);let cost=towerRepairCost(t);if(!cost||ink<cost){toast(cost?'Serve più grafite.':'Difesa già integra.');return false}ink-=cost;t.hp=t.maxhp;t.destroyed=false;t.damageFlash=0;upgradeFx(i);selected=i;saveRun();ui();sfx('repair');toast(t.type==='lab'?'Laboratorio ripristinato. Le ricerche possono riprendere.':'Difesa ripristinata.');towerDetails();return true}
function damageTower(i,amount){let t=towers[i];if(!towerOperational(t)||amount<=0)return;let was=t.hp;t.hp=Math.max(0,t.hp-amount*(sealTime>0?.55:1));let dealt=was-t.hp;t.damageFlash=1;if(t.hp<=0){let p=slot(i),type=t.type,color=DEFENSES[type].color;addFx('eraseBurst',{x:p.x,y:p.y,radius:48,color,life:.85,shape:type});burst(p.x,p.y,color,16);if(researchJob?.kind==='branch'&&researchJob.tower===i){let refund=Math.floor((researchJob.cost||48)*Math.max(0,researchJob.remaining)/researchJob.total);ink=Math.min(MAXINK,ink+refund);researchJob=null;toast('Specializzazione interrotta · recuperati '+refund+'✎')}clearTower(t);if(selected===i)selected=-1;if(gameMode==='erasers'){score+=45;ink=Math.min(MAXINK,ink+8);toast(DEFENSES[type].name+' cancellato!')}else toast(type==='lab'?'Laboratorio cancellato. Costruiscine uno per riprendere la ricerca.':DEFENSES[type].name+' cancellato · postazione libera.');sfx('breach');saveRun()}return dealt}
function towerPathOpen(e,p){let x=CX+Math.cos(e.a)*e.r,y=CY+Math.sin(e.a)*e.r,dx=p.x-x,dy=p.y-y,A=dx*dx+dy*dy;if(A<1)return true;for(let b of barriers){let ox=x-CX,oy=y-CY,B=2*(ox*dx+oy*dy),C=ox*ox+oy*oy-b.r*b.r,D=B*B-4*A*C;if(D<0)continue;for(let u of [(-B-Math.sqrt(D))/(2*A),(-B+Math.sqrt(D))/(2*A)])if(u>.001&&u<.999&&b.hp[index(Math.atan2(y+dy*u-CY,x+dx*u-CX))]>=7)return false}return true}
function engageTower(e,dt,controlled=false){if(e.dead||e.stun>0)return false;let p={x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r},target=-1,distance=controlled?32:125;for(let i=0;i<towers.length;i++){if(!towerOperational(towers[i]))continue;let q=slot(i),d=dist(p,q);if(d<distance&&towerPathOpen(e,q)){distance=d;target=i}}if(target<0)return false;let q=slot(target);if(distance>27&&!controlled){let step=Math.min(distance-26,e.speed*(e.slow>0?.42:1)*dt),x=p.x+(q.x-p.x)/distance*step,y=p.y+(q.y-p.y)/distance*step;e.a=norm(Math.atan2(y-CY,x-CX));e.r=Math.hypot(x-CX,y-CY)}else{damageTower(target,e.damage*.8*dt*(e.avatar&&reverseRage>0?1.7:1));e.towerSwing=(e.towerSwing||0)+dt;if(e.towerSwing>.24){e.towerSwing=0;addFx('cut',{x:q.x,y:q.y,angle:e.a,radius:16,color:'#bd8e87',life:.22})}}return true}
function damageTowersNear(p,r,amount){for(let i=0;i<towers.length;i++)if(towerOperational(towers[i])&&dist(p,slot(i))<r)damageTower(i,amount)}
function drawTowerCondition(i){let t=towers[i];ensureTowerHealth(t);if(!t.type||t.hp>=t.maxhp&&selected!==i)return;let health=t.hp/t.maxhp;rr(-18,30,36,3,1,'#d8d2c2');rr(-18,30,36*health,3,1,health<.35?'#bd8177':'#719e88')}

function norm(a){return(a%TAU+TAU)%TAU}function index(a){return Math.floor(norm(a)/TAU*N)%N}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function wavePressure(w){let n=Math.max(0,w-1);return {hp:1+n*.13+n*n*.011,damage:1+n*.045,speed:1+Math.min(.3,n*.035),interval:Math.max(.5,1.45-w*.08)}}
function spawnEnemy(type,angle,radius){let d=ENEMIES[type]||ENEMIES.pink,pressure=wavePressure(wave),health=d.hp*pressure.hp,e={id:nextId++,type,a:angle,r:radius??(barriers.at(-1)?.r||R)+170,hp:health,maxhp:health,speed:d.speed*pressure.speed,damage:d.damage*pressure.damage,width:d.width,armor:d.armor,slow:0,flash:0,attack:0,inside:false,dead:false,wobble:Math.random()*TAU,seek:1,slam:0};if(stasisTime>0)e.stun=stasisTime;enemies.push(e);if(isBoss(e)){addFx('spawn',{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r,radius:40,color:d.color,life:1});sfx('wave')}return e}
function gommario(){visitPanel('gommario',[]);show(`<div class="eyebrow">IL GOMMARIO</div><h2>Conosci chi cancella.</h2><div class="catalogue">${Object.entries(ENEMIES).map(([type,d])=>`<div class="choice"><b style="color:${d.color}">${type==='boss'?'▰':type==='splitter'?'◉':'▱'} ${d.name}</b><small>${d.desc}</small></div>`).join('')}</div><button class="btn green" onclick="showMenu(started&&!over)">Torna al menu</button>`)}
function planFor(w){if(gameMode==='daily'){let seed=[...(runDay||todayKey())].reduce((n,c)=>n+c.charCodeAt(0),0),indices=[0,seed%2?2:1,4,3];return WAVE_PLANS[indices[(w-1)%4]]}if(w<=8)return WAVE_PLANS[w-1];let p=WAVE_PLANS[4+(w-9)%4];return {name:'Margine '+w,types:[...p.types,...Array(Math.min(12,w-8)).fill(w%2?'fast':'armored')]}}

function forecast(){let p={types:plannedTypes(wave+1)},counts={};p.types.forEach(t=>counts[t]=(counts[t]||0)+1);return Object.entries(counts).map(([t,n])=>ENEMIES[t].name+' ×'+n).join(' · ')}
function startWave(){if(paused||over||phase!=='build')return;if(inputMode==='draw')cancelCircle();wave++;waveStartCore=core;phase='wave';selected=-1;inputMode='repair';pointers.clear();let plan=planFor(wave),types=plannedTypes(wave);queue=types.map((type,i)=>{let cluster=Math.floor(i/3),a=norm(wave*.77+cluster*1.8+(i%3)*.15+(gameMode==='daily'?[...(runDay||todayKey())].reduce((n,c)=>n+c.charCodeAt(0),0)*.19:0));return{type,a}});warningArcs=queue.slice(0,3).map(q=>({a:q.a,life:4}));spawnTimer=.9;dock();ui();toast('Ondata '+wave+' · '+plan.name);sfx('wave')}
function chooseUpgrade(){return false}
function waveComplete(){if(phase!=='wave')return;sealTime=stasisTime=stormTime=0;gainXP(20+wave*2);let perfect=core>=waveStartCore-.01;let stars=starsFor(Math.max(0,waveStartCore-core));recordStars(wave,stars);if(perfect){perfectWaves++;unlock('perfect')}ink=Math.min(MAXINK,ink+35+(perfect?10:0));score+=wave*80+(perfect?75:0);for(let b of barriers)for(let i=0;i<N;i++)b.hp[i]=Math.min(100,b.hp[i]+8);sfx('complete');if(wave>=(gameMode==='daily'?4:8)&&!endless){win();return}phase='build';dock();ui();saveRun();toast('Ondata '+wave+' superata '+'★'.repeat(stars)+'☆'.repeat(3-stars)+' · rifornimenti ricevuti.')}

function useSelectedPower(){let p=POWERS[selectedPower];if(gameMode==='erasers'){useReverseRage();return}if(paused||over||phase!=='wave'||!p)return false;if(!tech[selectedPower]||powerCharges[selectedPower]<=0){toast('Nessuna carica. Acquistala nel Laboratorio.');return false}if(selectedPower==='pulse'){let before=pulseCooldown;usePulse();return pulseCooldown>before}let cd=powerCooldowns[selectedPower];if(cd>0){toast('Potere in ricarica.');return false}powerCharges[selectedPower]--;powerCooldowns[selectedPower]=p.cooldown;if(selectedPower==='seal'){sealTime=6*paperProfile().duration;for(let b of barriers)for(let i=0;i<N;i++)b.hp[i]=Math.min(100,b.hp[i]+12);for(let b of barriers)addFx('seal',{x:CX,y:CY,radius:b.r,color:'#80b8a0',life:1.1});addFx('sealStamp',{x:CX,y:CY,radius:barriers.at(-1).r,color:'#4f9a80',life:1.2})}if(selectedPower==='stasis'){stasisTime=3;for(let e of enemies)e.stun=Math.max(e.stun||0,3);addFx('frost',{x:CX,y:CY,radius:barriers.at(-1).r+90,color:'#94c7de',life:1})}if(selectedPower==='storm'){stormTime=2.2;stormTick=0;stormCursor=0;addFx('storm',{x:CX,y:CY,radius:barriers.at(-1).r+80,color:'#a598ca',life:1})}toast(p.name+'!');sfx('complete');ui();return true}
function updatePowers(dt){for(let key of Object.keys(powerCooldowns))powerCooldowns[key]=Math.max(0,powerCooldowns[key]-dt);sealTime=Math.max(0,sealTime-dt);stasisTime=Math.max(0,stasisTime-dt);if(stormTime>0){stormTime-=dt;stormTick-=dt;if(stormTick<=0){stormTick=.14;let alive=enemies.filter(e=>!e.dead);if(alive.length){let e=alive[stormCursor++%alive.length],target={x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r};hurtEnemy(e,45,true);e.stun=Math.max(e.stun||0,.45);addFx('lightning',{x:target.x-34,y:target.y-380,tx:target.x,ty:target.y,color:'#a697c8',life:.3});addFx('scorch',{x:target.x,y:target.y,radius:26,color:'#3d3550',life:1.6});addFx('impact',{x:target.x,y:target.y,radius:25,color:'#a697c8',life:.35})}}}}

function usePulse(){if(gameMode==='erasers')return useReverseRage();if(paused||over||phase!=='wave')return;if(pulseCooldown>0){toast('Il soffio torna fra '+Math.ceil(pulseCooldown)+' secondi.');return}if(!tech.pulse||powerCharges.pulse<=0){toast('Nessuna carica di Soffio. Acquistala nel Laboratorio.');return false}powerCharges.pulse--;pulseCooldown=32;runStats.pulses=(runStats.pulses||0)+1;for(let e of enemies){e.r+=38;e.stun=1.8;burst(CX+Math.cos(e.a)*e.r,CY+Math.sin(e.a)*e.r,'#b5ccc1',4)}rings.push({x:CX,y:CY,r:35,life:2,c:'#82aaa0'});addFx('pulseWave',{x:CX,y:CY,radius:(barriers.at(-1).r+150),color:'#6fa89c',life:.9});toast('Soffio! Le gomme arretrano.');sfx('complete');dock();ui()}

function purchaseTower(type){hide();build(type);selected=-1;dock()}
function build(type){if(type==='lab'&&labIndex()>=0){toast('Hai già un Laboratorio.');return false}if(type!=='triangle'&&type!=='lab'&&!tech[type]){toast('Prima completa la ricerca nel Laboratorio.');return false}if(selected<0||paused||over||towers[selected].type||!DEFENSES[type])return false;let d=DEFENSES[type],cost=defenseCost(type);if(ink<cost){toast('Serve più grafite');return false}ink-=cost;towers[selected].type=type;towers[selected].hp=towerMaxHP(towers[selected]);towers[selected].maxhp=towers[selected].hp;towers[selected].destroyed=false;towers[selected].branch=null;towers[selected].cooldown=.1;if(new Set(towers.filter(t=>t.type&&t.type!=='lab').map(t=>t.type)).size===5)unlock('variety');burst(slot(selected).x,slot(selected).y,d.color,12);sfx('build');toast(d.name+' pronto. '+d.desc);ui();dock();return true}

function hurtEnemy(e,damage,pierce=false,kind=''){if(gameMode==='erasers'){hurtEraser(e,damage,pierce);return}if(e.dead)return;if(WET_KINDS.includes(kind)&&(e.slow>0||e.stun>0)&&!isBoss(e))damage*=1.25;let armor=e.armor||0;e.hp-=damage*(pierce?1:1-armor);e.flash=1;if(e.hp<=0){e.dead=true;kills++;gainXP(isBoss(e)?65:e.type==='mini'?3:e.type==='armored'?13:e.type==='splitter'?12:e.type==='fast'?9:8);if(isBoss(e)){bossKills++;unlock('boss');addFx('bossDeath',{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r,radius:90,color:ENEMIES[e.type].color,life:1.3});shake=2}score+=isBoss(e)?180:e.type==='mini'?8:e.type==='fast'?25:30;ink=Math.min(MAXINK,ink+(isBoss(e)?24:e.type==='mini'?2:7));if(e.type==='splitter'){spawnEnemy('mini',e.a-.055,e.r+9);spawnEnemy('mini',e.a+.055,e.r+9)}let x=CX+Math.cos(e.a)*e.r,y=CY+Math.sin(e.a)*e.r;burst(x,y,e.type==='fast'?'#9bbdca':'#dba9aa',14);sfx('pop')}}
function updateDefenses(dt){for(let i=0;i<towers.length;i++){let t=towers[i];t.flash=Math.max(0,t.flash-dt*4);t.damageFlash=Math.max(0,(t.damageFlash||0)-dt*4);if(!towerOperational(t)||t.type==='lab')continue;t.cooldown-=dt;let p=slot(i),d=DEFENSES[t.type],range=towerRange(t);if(t.type==='mender'&&t.branch==='ward'){if(t.cooldown<=0&&ink>=3){let b=nearestBarrier(p),center=index(Math.atan2(p.y-CY,p.x-CX));patches.push({barrier:b.id,center,width:3,shield:45,life:6});ink-=3;t.cooldown=4;t.flash=1;addFx('seal',{x:CX+Math.cos(center/N*TAU)*b.r,y:CY+Math.sin(center/N*TAU)*b.r,radius:22,color:'#91ab78',life:.7})}continue}if(t.type==='mender'){if(t.cooldown<=0&&ink>1){let weakest=null;for(let b of barriers)for(let k=0;k<N;k++){let a=(k+.5)/N*TAU,q={x:CX+Math.cos(a)*b.r,y:CY+Math.sin(a)*b.r};if(b.hp[k]<90&&dist(p,q)<range&&(!weakest||b.hp[k]<weakest.hp))weakest={b,k,hp:b.hp[k],q}}if(weakest){let amount=Math.min(100-weakest.hp,12+t.level*6,ink/.04);weakest.b.hp[weakest.k]+=amount;ink-=amount*.04;if(t.branch==='stitch'){for(let extra of [-1,1]){let k=(weakest.k+extra+N)%N,healed=Math.min(100-weakest.b.hp[k],amount,Math.max(0,ink)/.04);weakest.b.hp[k]+=healed;ink-=healed*.04}}t.cooldown=1;t.flash=1;rings.push({x:weakest.q.x,y:weakest.q.y,r:4,life:.5,c:'#90aa72'});addFx('thread',{x:p.x,y:p.y,tx:weakest.q.x,ty:weakest.q.y,color:'#90aa72',life:.55});addFx('mend',{x:weakest.q.x,y:weakest.q.y,radius:18,color:'#90aa72',life:.65})}}continue}if(t.type==='octagon'){if(t.cooldown<=0&&ink>=2){let b=nearestBarrier(p),center=index(Math.atan2(p.y-CY,p.x-CX));patches.push({barrier:b.id,center,width:t.branch==='bastion'?10:6,shield:(55+t.level*20)*(t.branch==='bastion'?2:1),life:5});ink-=2;t.cooldown=d.rate;t.flash=1;addFx('seal',{x:CX+Math.cos(center/N*TAU)*b.r,y:CY+Math.sin(center/N*TAU)*b.r,radius:28,color:d.color,life:.6});if(t.branch==='rebound')addFx('shockwave',{x:p.x,y:p.y,radius:range,color:d.color,life:.5});if(t.branch==='rebound')for(let e of enemies)if(!e.dead&&dist(p,{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r})<range)hurtEnemy(e,18*damageMult,false)}continue}let nearby=enemies.filter(e=>!e.dead&&dist(p,{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r})<range);if(t.type==='pentagon'||t.type==='star'){if(t.cooldown<=0&&nearby.length&&ink>=.65){nearby.sort(targetOrder(t));let targets=[];if(t.type==='star')targets=nearby;else{let current=nearby[0];targets=[current];for(let hop=1;hop<(t.branch==='arc'?5:3);hop++){let from={x:CX+Math.cos(current.a)*current.r,y:CY+Math.sin(current.a)*current.r},next=nearby.find(e=>!targets.includes(e)&&dist(from,{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r})<(t.branch==='arc'?150:105));if(!next)break;targets.push(next);current=next}}let origin=p;targets.forEach((e,j)=>{let q={x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r},damage=(d.damage+(t.level-1)*7)*damageMult*(t.branch==='nova'?1.25:1)*(t.type==='pentagon'?Math.pow(.8,j):1);hurtEnemy(e,damage,t.branch==='ion','pentagon');if(t.branch==='ion')e.stun=Math.max(e.stun||0,.45);if(t.branch==='ion')addFx('ionSpark',{x:q.x,y:q.y,radius:20,color:'#8f8af0',life:.4});if(t.branch==='comet')e.slow=Math.max(e.slow||0,1.5);if(t.branch==='comet')addFx('cometTrail',{x:p.x,y:p.y,tx:q.x,ty:q.y,color:'#e8a0b8',life:.35});addFx(t.type==='pentagon'?'lightning':'starRay',{x:origin.x,y:origin.y,tx:q.x,ty:q.y,color:d.color,life:.4});if(t.type==='pentagon')origin=q});if(t.type==='star')addFx('starBurst',{x:p.x,y:p.y,radius:range,color:d.color,life:.7});if(t.branch==='nova')addFx('shockwave',{x:p.x,y:p.y,radius:range,color:'#f4c9a0',life:.55});t.angle=Math.atan2(CY+Math.sin(nearby[0].a)*nearby[0].r-p.y,CX+Math.cos(nearby[0].a)*nearby[0].r-p.x);t.cooldown=d.rate/(1+(t.level-1)*.2);ink-=.65;t.flash=1}continue}if(t.type==='spiral'){if(nearby.length&&ink>.06){ink=Math.max(0,ink-dt*.45);nearby.forEach(e=>{e.slow=.2+t.level*.12;if(t.branch==='vortex'){let desired=Math.atan2(p.y-CY,p.x-CX),diff=Math.atan2(Math.sin(desired-e.a),Math.cos(desired-e.a));e.a+=Math.max(-.3*dt,Math.min(.3*dt,diff))}});if(t.cooldown<=0){rings.push({x:p.x,y:p.y,r:15,life:.8,c:d.color});addFx(t.branch==='frost'?'frost':'spiral',{x:p.x,y:p.y,radius:range*.5,color:d.color,life:.85});if(t.branch==='vortex')addFx('vortexPull',{x:p.x,y:p.y,radius:range*.6,color:d.color,life:.9});if(t.branch==='frost')nearby.forEach(e=>e.stun=Math.max(e.stun||0,.7));t.cooldown=t.branch==='frost'?2.5:1.2}}continue}if(t.cooldown<=0&&nearby.length&&ink>=.18){nearby.sort(targetOrder(t));let e=nearby[0],ex=CX+Math.cos(e.a)*e.r,ey=CY+Math.sin(e.a)*e.r;t.angle=Math.atan2(ey-p.y,ex-p.x);bullets.push({x:p.x,y:p.y,target:e.id,damage:(d.damage+(t.level-1)*(t.type==='mortar'?13:9))*damageMult,kind:t.type,branch:t.branch,originX:p.x,originY:p.y,age:0,initialDistance:Math.hypot(ex-p.x,ey-p.y),life:3,tail:[]});if(t.branch==='fan'){let last=bullets.at(-1);last.damage*=.65;for(let j=1;j<3;j++){let target=nearby[j%nearby.length];bullets.push({...last,target:target.id,x:p.x+Math.sin(t.angle)*j*5,y:p.y-Math.cos(t.angle)*j*5,tail:[]})}}addFx(t.type==='sniper'?'muzzleBeam':t.type==='mortar'?'muzzleInk':'muzzleShard',{x:p.x,y:p.y,angle:t.angle,color:d.color,life:t.type==='mortar'?.35:.18});ink=Math.max(0,ink-(t.type==='mortar'?.45:.18));t.cooldown=d.rate*(t.branch==='fan'?1.4:1)/(1+(t.level-1)*.22);t.flash=1;if(fxTimer<=0){sfx('shoot');fxTimer=.08}}}}
const GEOMETRY_NOTES={triangle:'3 lati · la punta concentra il tiro',spiral:'Curva continua · il vortice rallenta',mortar:'6 lati · la forza si espande dal centro',sniper:'4 lati · la diagonale guida il colpo',mender:'4 lati uguali · ricuce il contorno',pentagon:'5 vertici · il fulmine collega i bersagli',star:'5 punte · attacco in ogni direzione',octagon:'8 lati · protegge un arco di cerchio',lab:'Tavola di progetto · un banco di ricerca'};

function towerDetails(){visitPanel('tower',[selected]);let t=towers[selected];if(!t?.type)return;ensureTowerHealth(t);if(t.type==='lab'&&towerOperational(t)){labMenu();return}let d=DEFENSES[t.type],branch=t.branch?SPECIALIZATIONS[t.type]?.[t.branch]:null;show(`<div class="eyebrow keep">POSTAZIONE ${selected+1} · LIVELLO ${t.level}</div><div class="tower-portrait">${figureIcon(t.type,72)}</div><h2>${d.name}</h2>${drawingSpec(t)}${towerRepairButton(selected)}<p>${branch?branch.name+' · '+branch.desc:d.desc}</p>${t.type==='lab'&&researchJob?'<p>Ricerca sospesa: '+jobName()+'. Il tempo già investito è conservato.</p>':''}${repairAllButton()}${!t.destroyed&&t.type!=='lab'?targetButton(selected):''}${!t.destroyed&&t.type!=='lab'&&t.level<3?upgradePreview(t):''}${!t.destroyed&&t.type!=='lab'&&t.level<3?`<button class="btn green" ${ink<(24+t.level*12)?'disabled':''} onclick="purchaseUpgrade()">${t.level===1?'Potenzia · 36✎':'Scegli evoluzione · 48✎'}</button>`:''}${t.type!=='lab'?`<button class="link-btn danger" onclick="if(this.dataset.s){hide();sellTower();selected=-1;dock()}else{this.dataset.s=1;this.textContent='Tocca ancora per cancellare'}">Cancella · recupera ${t.destroyed?0:Math.floor((15+(t.level-1)*12)*t.hp/t.maxhp)}✎</button>`:''}`)}
function purchaseUpgrade(){let wasLevel=towers[selected]?.level;hide();upgradeTower();if(wasLevel===2)return;if(towers[selected]?.level===2&&!towers[selected].branch)toast('Torre potenziata. Alla prossima evoluzione scegli il suo stile.');selected=-1;dock()}
function upgradeTower(){if(selected<0||paused||over)return;let t=towers[selected],cost=24+t.level*12;if(!towerOperational(t)||t.level>=3)return false;if(researchJob?.kind==='branch'&&researchJob.tower===selected){toast('Specializzazione già in corso.');return false;}if(t.level===2){if(!tech.evolutions){toast('Ricerca Evoluzioni nel Laboratorio.');return false}showSpecializations();return}if(ink<cost){toast('Serve più grafite');return false}ink-=cost;t.level++;upgradeFx(selected);sfx('build');ui();dock();return true}
function showSpecializations(){visitPanel('branches',[selected]);let t=towers[selected];if(!t?.type||t.level!==2||!tech.evolutions)return;show(`<div class="eyebrow keep">EVOLUZIONE · 48✎ · 18s</div><h2>Scegli il tuo tratto.</h2><p>Il Laboratorio sviluppa questa specializzazione in 18 secondi di assalto. La torre resta attiva durante la ricerca.</p><p class="lock-reason">${blockReason(48)}</p><div class="specializations">${Object.entries(SPECIALIZATIONS[t.type]).map(([key,v])=>`<button class="choice" ${researchJob||!hasLab()||ink<48?'disabled':''} onclick="specializeTower('${key}')"><b>${v.icon} ${v.name}</b><small>${v.desc}</small></button>`).join('')}</div>`)}

function sellTower(){if(selected<0||paused||over)return;let t=towers[selected];if(!t.type)return;if(researchJob?.kind==='branch'&&researchJob.tower===selected){toast('Specializzazione in corso: attendi il completamento.');return}ensureTowerHealth(t);ink=Math.min(MAXINK,ink+(t.destroyed?0:Math.floor((15+(t.level-1)*12)*t.hp/t.maxhp)));t.type=null;t.level=1;t.branch=null;delete t.hp;delete t.maxhp;t.destroyed=false;ui();dock();toast('Torre cancellata. Grafite recuperata.')}
function autoRepair(){if(paused||over||phase!=='build')return;if(ink<35){toast('Servono 35 unità di grafite');return}if(barriers.every(b=>b.hp.every(v=>v>=95))){toast('Il contorno è già solido');return}ink-=35;for(let b of barriers)for(let i=0;i<N;i++)b.hp[i]=Math.min(100,b.hp[i]+40);burst(CX,CY,'#99aa99',18);sfx('repair');ui();toast('Contorno ripassato · +40 a ogni tratto')}

iale" onclick="powerMenu()">⌄</button></div>`}}

h*.11,1.3,0,TAU);ctx.fill();ctx.restore();if(!e.avatar&&e.arrivalUntil>clock)label('ALLEATA',x,y-29,11,'#9c6b7e');if(e.avatar){label('TU',x,y-28,12,'#a16665');ctx.beginPath();ctx.arc(x,y,25,0,TAU);ctx.strokeStyle=reverseRage>0?'#d6a262':'#ce9f9b99';ctx.lineWidth=2;ctx.stroke()}drawEnemyHud(e,x,y,w,h);if(stasisTime>0&&e.stun>0){label('❋',x,y-25,20,'#8bbfd4')}if((e.siege||0)>10){ctx.strokeStyle='#bd6e6c99';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,Math.max(w,h)*.8,clock*2,clock*2+Math.PI*1.5);ctx.stroke()}if(e.slow>0){ctx.beginPath();ctx.arc(x,y,Math.max(w,h)*.7,0,TAU);ctx.strokeStyle='#89abb177';ctx.lineWidth=1;ctx.stroke()}}

function applyView(){view.scale=camera.base*camera.zoom;view.x=camera.cx-CX*view.scale+camera.panX;view.y=camera.cy-CY*view.scale+camera.panY}
function zoomBy(k){camera.zoom=Math.max(.55,Math.min(2.2,camera.zoom*k));applyView()}
function fitView(){camera.zoom=1;camera.panX=camera.panY=0;applyView()}
function screenPoint(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function resetContacts(){avatarTarget=null;contacts.clear();pointers.clear();transformState=null;gestureLocked=false;drawPointer=null;drawPath=[];$('gestureHint').classList.remove('visible')}
function beginTransform(){let a=[...contacts.values()];if(a.length<2)return;let p=a[0].screen,q=a[1].screen,mid={x:(p.x+q.x)/2,y:(p.y+q.y)/2};transformState={distance:Math.max(1,dist(p,q)),zoom:camera.zoom,anchor:{x:(mid.x-view.x)/view.scale,y:(mid.y-view.y)/view.scale}};gestureLocked=true;avatarTarget=null;pointers.clear();drawPath=[];drawPointer=null;$('gestureHint').textContent='Due dita · sposta e ingrandisci';$('gestureHint').classList.add('visible')}
function moveTransform(){if(!transformState||contacts.size<2)return;let a=[...contacts.values()],p=a[0].screen,q=a[1].screen,mid={x:(p.x+q.x)/2,y:(p.y+q.y)/2};camera.zoom=Math.max(.55,Math.min(2.2,transformState.zoom*dist(p,q)/transformState.distance));let scale=camera.base*camera.zoom;camera.panX=Math.max(-W,Math.min(W,mid.x-camera.cx+(CX-transformState.anchor.x)*scale));camera.panY=Math.max(-H,Math.min(H,mid.y-camera.cy+(CY-transformState.anchor.y)*scale));applyView()}
function openRepairTools(){visitPanel('tools',[]);show(`<div class="eyebrow">LA TUA MATITA</div><h2>Come ripari?</h2><div class="repair-options">${Object.entries(REPAIR_TOOLS).map(([k,t])=>`<button class="choice ${repairTool===k?'selected':''}" onclick="selectRepairTool('${k}')"><b>${t.icon} ${t.name}</b><small>${k!=='pencil'&&!tech[k]?'⌁ Richiedi questa ricerca al Laboratorio. ':''}${t.desc}</small></button>`).join('')}</div><button class="btn light" onclick="backPanel()">Indietro</button>`)}
function selectRepairTool(tool){if(!REPAIR_TOOLS[tool])return;if(tool!=='pencil'&&!tech[tool]){labMenu('research');return}repairTool=tool;hide();dock();toast(REPAIR_TOOLS[tool].desc)}
function nearestBarrier(p){let radius=Math.hypot(p.x-CX,p.y-CY);return barriers.reduce((a,b)=>Math.abs(b.r-radius)<Math.abs(a.r-radius)?b:a,barriers[0])}
function useRepairTool(start,end=start){if(repairTool!=='pencil'&&!tech[repairTool]){toast('Prima completa la ricerca.');return false}let b=nearestBarrier(end);if(!b||Math.abs(Math.hypot(end.x-CX,end.y-CY)-b.r)>Math.max(30,20/view.scale)){toast('Agisci sul contorno di un cerchio.');return false}let center=index(Math.atan2(end.y-CY,end.x-CX));if(repairTool==='patch'){if(ink<12){toast('Servono 12✎ per la toppa.');return false}if(patches.some(p=>p.barrier===b.id&&Math.abs(Math.atan2(Math.sin((p.center-center)*TAU/N),Math.cos((p.center-center)*TAU/N)))<.15)){toast('Questo tratto ha già una toppa.');return false}ink-=12;patches.push({barrier:b.id,center,width:4,shield:140,life:10*paperProfile().duration});burst(CX+Math.cos(center/N*TAU)*b.r,CY+Math.sin(center/N*TAU)*b.r,'#b4c7a5',10);toast('Toppa applicata · '+(10*paperProfile().duration)+' secondi');sfx('repair');ui();return true}if(repairTool==='stitch'){let begin=index(Math.atan2(start.y-CY,start.x-CX)),delta=((center-begin+N*1.5)%N)-N/2,indices=[];if(Math.abs(delta)>14){toast('Cuci una breccia più corta.');return false}if(Math.abs(delta)<2){for(let j=-3;j<=3;j++)indices.push((center+j+N)%N)}else{let direction=Math.sign(delta);for(let j=0;j<=Math.abs(delta);j++)indices.push((begin+j*direction+N)%N)}let dir=indices.length>1&&((indices[1]-indices[0]+N)%N)===1?1:-1,before=(indices[0]-dir+N)%N,after=(indices.at(-1)+dir+N)%N;if(!indices.some(i=>b.hp[i]<20)||b.hp[before]<20||b.hp[after]<20){toast('Serve una breccia con due estremità sane.');return false}if(ink<8){toast('Servono 8✎ per la cucitura.');return false}ink-=8;for(let i of indices)b.hp[i]=Math.max(65,b.hp[i]);stitches.push({barrier:b.id,indices,life:8});toast('Breccia ricucita.');sfx('repair');ui();return true}return false}
function erodeSegment(b,k,amount){if(sealTime>0)amount*=.35;for(let p of patches){let d=Math.abs(((k-p.center+N*1.5)%N)-N/2);if(p.barrier===b.id&&p.life>0&&d<=p.width&&p.shield>0){let absorb=Math.min(p.shield,amount);p.shield-=absorb;amount-=absorb;if(amount<=0)return}}b.hp[k]=Math.max(0,b.hp[k]-amount*paperProfile().fragile)}

function coords(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.scale,y:(e.clientY-r.top-view.y)/view.scale}}
cv.onpointerdown=e=>{if(mixedTouchLock||!started||(paused&&!pendingAlly)||over)return;e.preventDefault();cv.setPointerCapture(e.pointerId);let screen=screenPoint(e),world=coords(e);contacts.set(e.pointerId,{screen,start:screen,world,startWorld:world,moved:0,tower:-1});if(contacts.size>=2){beginTransform();return}if(gestureLocked)return;if(gameMode==='erasers'){if(pendingAlly)chooseAllyPoint(world);else avatarTarget=world;return}if(inputMode==='draw'){drawPointer=e.pointerId;drawPath=[world];return}let contact=contacts.get(e.pointerId);for(let i=towers.length-1;i>=0;i--)if(dist(world,slot(i))<Math.min(38,Math.max(30,23/view.scale))){contact.tower=i;return}if(repairTool==='pencil')pointers.set(e.pointerId,{...world,delay:.08});};
cv.onpointermove=e=>{let contact=contacts.get(e.pointerId);if(!contact||(paused&&!pendingAlly))return;contact.screen=screenPoint(e);contact.moved=Math.max(contact.moved,dist(contact.screen,contact.start));if(contacts.size>=2){moveTransform();return}if(gestureLocked)return;let world=coords(e);contact.world=world;if(gameMode==='erasers'){if(pendingAlly)chooseAllyPoint(world);else avatarTarget=world;return}if(inputMode==='draw'&&drawPointer===e.pointerId){if(dist(world,drawPath.at(-1))>3)drawPath.push(world);return}if(repairTool==='pencil'&&contact.tower<0){let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{...world,delay:old?.delay||0})}};
function release(e){let contact=contacts.get(e.pointerId);if(!contact)return;let consumed=gestureLocked||contacts.size>=2;pointers.delete(e.pointerId);contacts.delete(e.pointerId);if(!consumed&&!paused&&!over&&gameMode!=='erasers'){if(inputMode==='draw'&&drawPointer===e.pointerId)finishCircle();else if(contact.tower>=0&&contact.moved<12){selected=contact.tower;dock();if(!towers[selected].type)catalogue();else towerDetails();sfx('tap')}else if(repairTool!=='pencil'&&contact.tower<0)useRepairTool(contact.startWorld,contact.world);else if(contact.moved<10&&selected>=0){selected=-1;dock()}}if(contacts.size===0){transformState=null;gestureLocked=false;$('gestureHint').classList.remove('visible');drawPointer=null}else if(contacts.size>=2)beginTransform()}
cv.onpointerup=release;cv.onpointercancel=e=>{pointers.delete(e.pointerId);contacts.delete(e.pointerId);drawPath=[];drawPointer=null;if(!contacts.size){transformState=null;gestureLocked=false;$('gestureHint').classList.remove('visible')}};cv.onlostpointercapture=e=>{if(contacts.has(e.pointerId))cv.onpointercancel(e)};
cv.addEventListener('wheel',e=>{if(paused||!started||over)return;e.preventDefault();if(e.ctrlKey||e.metaKey){let p=screenPoint(e),anchor={x:(p.x-view.x)/view.scale,y:(p.y-view.y)/view.scale};camera.zoom=Math.max(.55,Math.min(2.2,camera.zoom*Math.exp(-e.deltaY*.008)));let scale=camera.base*camera.zoom;camera.panX=p.x-camera.cx+(CX-anchor.x)*scale;camera.panY=p.y-camera.cy+(CY-anchor.y)*scale}else{camera.panX=Math.max(-W,Math.min(W,camera.panX-e.deltaX));camera.panY=Math.max(-H,Math.min(H,camera.panY-e.deltaY))}applyView()},{passive:false});
// Safari can ignore viewport limits: explicitly block native scale gestures.
function blockPageZoom(e){if(e.cancelable)e.preventDefault()}
for(let name of ['gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(name,blockPageZoom,{passive:false,capture:true});
let mixedTouchLock=false;
function guardTouches(e){let touches=Array.from(e.touches||[]),onField=started&&!over&&(!paused||!!pendingAlly)&&touches.every(t=>t.target===cv);if(touches.length>1&&!onField){mixedTouchLock=true;resetContacts();gestureLocked=true;blockPageZoom(e)}else if(mixedTouchLock){blockPageZoom(e);if(!touches.length){mixedTouchLock=false;resetContacts()}}}
for(let name of ['touchstart','touchmove','touchend','touchcancel'])document.addEventListener(name,guardTouches,{passive:false,capture:true});
// Ctrl+wheel must never scale home or panels. Field zoom uses the camera handler.
document.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)blockPageZoom(e)},{passive:false,capture:true});
window.addEventListener('blur',()=>{mixedTouchLock=false;saveRun();resetContacts();if(started&&!paused&&!over)pauseGame()});document.addEventListener('visibilitychange',()=>{if(document.hidden){mixedTouchLock=false;resetContacts();saveRun();if(started&&!paused&&!over)pauseGame()}});window.addEventListener('keydown',e=>{if(e.code==='Escape')pauseGame();if(e.code==='KeyF'&&!e.repeat)usePulse();if(e.code==='Space'&&!e.repeat&&phase==='build'){e.preventDefault();startWave()}});

function sfx(type){hapticFor(type);if(!soundOn||!audio||prefs.volume<=0)return;try{let o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime,f={shoot:650,pop:240,hit:100,breach:130,build:480,complete:680,start:420,wave:220,repair:330,lose:90,tap:460}[type]||300;o.type=type==='shoot'?'triangle':'sine';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*(type==='complete'?1.8:.5)),now+.12);g.gain.setValueAtTime((type==='shoot'?.018:.045)*(prefs.volume/70),now);g.gain.exponentialRampToValueAtTime(.001,now+.16);o.connect(g);g.connect(audio.destination);o.start();o.stop(now+.17)}catch(e){}}
function frame(t){let dt=Math.max(0,Math.min(.04,(t-last)/1000||0));last=t;update(dt*gameSpeed);paperWarmth+=(paperAgeValue()-paperWarmth)*(1-Math.exp(-dt*1.8));draw();requestAnimationFrame(frame)}init();phase='intro';ui();intro();requestAnimationFrame(frame);
