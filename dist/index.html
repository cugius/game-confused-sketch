function pauseGame(){if(!started||over)return;saveRun();showMenu(true)}function resume(){hide()}
function toast(t){$('noticeText').textContent=t;$('notice').style.opacity=1;noticeTime=3.2}
function norm(a){return(a%TAU+TAU)%TAU}function index(a){return Math.floor(norm(a)/TAU*N)%N}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function wavePressure(w){let n=Math.max(0,w-1);return {hp:1+n*.13+n*n*.011,damage:1+n*.045,speed:1+Math.min(.3,n*.035),interval:Math.max(.5,1.45-w*.08)}}
function spawnEnemy(type,angle,radius){let d=ENEMIES[type]||ENEMIES.pink,pressure=wavePressure(wave),health=d.hp*pressure.hp,e={id:nextId++,type,a:angle,r:radius??(barriers.at(-1)?.r||R)+170,hp:health,maxhp:health,speed:d.speed*pressure.speed,damage:d.damage*pressure.damage,width:d.width,armor:d.armor,slow:0,flash:0,attack:0,inside:false,dead:false,wobble:Math.random()*TAU,seek:1,slam:0};if(stasisTime>0)e.stun=stasisTime;enemies.push(e);if(isBoss(e)){addFx('spawn',{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r,radius:40,color:d.color,life:1});sfx('wave')}return e}
function gommario(){visitPanel('gommario',[]);show(`<div class="eyebrow">IL GOMMARIO</div><h2>Conosci chi cancella.</h2><div class="catalogue">${Object.entries(ENEMIES).map(([type,d])=>`<div class="choice"><b style="color:${d.color}">${type==='boss'?'▰':type==='splitter'?'◉':'▱'} ${d.name}</b><small>${d.desc}</small></div>`).join('')}</div><button class="btn green" onclick="showMenu(started&&!over)">Torna al menu</button>`)}
function planFor(w){if(gameMode==='daily'){let seed=[...(runDay||todayKey())].reduce((n,c)=>n+c.charCodeAt(0),0),indices=[0,seed%2?2:1,4,3];return WAVE_PLANS[indices[(w-1)%4]]}if(w<=8)return WAVE_PLANS[w-1];let p=WAVE_PLANS[4+(w-9)%4];return {name:'Margine '+w,types:[...p.types,...Array(Math.min(12,w-8)).fill(w%2?'fast':'armored')]}}
function plannedTypes(w){let types=[...planFor(w).types];if(w>=3)for(let i=0;i<Math.min(4,Math.floor((w-1)/2));i++)types.push(w%2?'fast':'pink');return types}
function forecast(){let p={types:plannedTypes(wave+1)},counts={};p.types.forEach(t=>counts[t]=(counts[t]||0)+1);return Object.entries(counts).map(([t,n])=>ENEMIES[t].name+' ×'+n).join(' · ')}
function startWave(){if(paused||over||phase!=='build')return;if(inputMode==='draw')cancelCircle();wave++;waveStartCore=core;phase='wave';selected=-1;inputMode='repair';pointers.clear();let plan=planFor(wave),types=plannedTypes(wave);queue=types.map((type,i)=>{let cluster=Math.floor(i/3),a=norm(wave*.77+cluster*1.8+(i%3)*.15+(gameMode==='daily'?[...(runDay||todayKey())].reduce((n,c)=>n+c.charCodeAt(0),0)*.19:0));return{type,a}});warningArcs=queue.slice(0,3).map(q=>({a:q.a,life:4}));spawnTimer=.9;dock();ui();toast('Ondata '+wave+' · '+plan.name);sfx('wave')}
function chooseUpgrade(){return false}
function waveComplete(){if(phase!=='wave')return;sealTime=stasisTime=stormTime=0;gainXP(20+wave*2);let perfect=core>=waveStartCore-.01;let stars=starsFor(Math.max(0,waveStartCore-core));recordStars(wave,stars);statAdd('waves');statMax('bestWave',wave);if(perfect){perfectWaves++;statAdd('perfect');unlock('perfect')}persistMeta();achCheck();gcScores();ink=Math.min(MAXINK,ink+35+(perfect?10:0));score+=wave*80+(perfect?75:0);for(let b of barriers)for(let i=0;i<N;i++)b.hp[i]=Math.min(100,b.hp[i]+8);sfx('complete');if(wave>=(gameMode==='daily'?4:8)&&!endless){win();return}phase='build';dock();ui();saveRun();toast('Ondata '+wave+' superata '+'★'.repeat(stars)+'☆'.repeat(3-stars)+' · rifornimenti ricevuti.')}

function powerMenu(){if(gameMode==='erasers'){attackShop();return}visitPanel('powers',[]);unseenPower=false;let known=Object.entries(POWERS).filter(([k])=>tech[k]);show(known.length?`<h2>Scegli una carica.</h2>${known.map(([key,p])=>`<div class="power-row"><button class="choice power-card ${key===selectedPower?'selected':''}" ${powerCharges[key]?'':'disabled'} onclick="selectPower('${key}')"><b>${p.icon} ${p.name}<em>×${powerCharges[key]}</em></b><small>${p.desc}</small>${powerCharges[key]?'':'<span class="lock-reason">Nessuna carica</span>'}</button><button class="btn light buy-charge" ${powerCharges[key]>=3||ink<p.cost?'disabled':''} aria-label="${t('Acquista una carica di {0}',p.name)}" onclick="buyPowerCharge('${key}');powerMenu()">+1<br><small>${powerCharges[key]>=3?'pieno':p.cost+'✎'}</small></button></div>`).join('')}<button class="btn light" onclick="labMenu('charges')">⌂ Apri il Laboratorio</button>`:`<h2>Nessun potere.</h2><p class="empty-state">Ricerca un potere nel Laboratorio: poi potrai acquistarne le cariche qui.</p><button class="btn green" onclick="labAccess()">⌂ Apri il Laboratorio</button>`)}
function selectPower(key){if(!POWERS[key]||!tech[key]||powerCharges[key]<=0)return false;selectedPower=key;hide();dock();ui();return true}
function useSelectedPower(){let p=POWERS[selectedPower];if(gameMode==='erasers'){useReverseRage();return}if(paused||over||phase!=='wave'||!p)return false;if(!tech[selectedPower]||powerCharges[selectedPower]<=0){toast('Nessuna carica. Acquistala nel Laboratorio.');return false}if(selectedPower==='pulse'){let before=pulseCooldown;usePulse();return pulseCooldown>before}let cd=powerCooldowns[selectedPower];if(cd>0){toast('Potere in ricarica.');return false}powerCharges[selectedPower]--;statAdd('powers');achCheck();powerCooldowns[selectedPower]=p.cooldown;if(selectedPower==='seal'){sealTime=6*paperProfile().duration;for(let b of barriers)for(let i=0;i<N;i++)b.hp[i]=Math.min(100,b.hp[i]+12);for(let b of barriers)addFx('seal',{x:CX,y:CY,radius:b.r,color:'#80b8a0',life:1.1});addFx('sealStamp',{x:CX,y:CY,radius:barriers.at(-1).r,color:'#4f9a80',life:1.2})}if(selectedPower==='stasis'){stasisTime=3;for(let e of enemies)e.stun=Math.max(e.stun||0,3);addFx('frost',{x:CX,y:CY,radius:barriers.at(-1).r+90,color:'#94c7de',life:1})}if(selectedPower==='storm'){stormTime=2.2;stormTick=0;stormCursor=0;addFx('storm',{x:CX,y:CY,radius:barriers.at(-1).r+80,color:'#a598ca',life:1})}toast(p.name+'!');sfx('complete');ui();return true}
function updatePowers(dt){for(let key of Object.keys(powerCooldowns))powerCooldowns[key]=Math.max(0,powerCooldowns[key]-dt);sealTime=Math.max(0,sealTime-dt);stasisTime=Math.max(0,stasisTime-dt);if(stormTime>0){stormTime-=dt;stormTick-=dt;if(stormTick<=0){stormTick=.14;let alive=enemies.filter(e=>!e.dead);if(alive.length){let e=alive[stormCursor++%alive.length],target={x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r};hurtEnemy(e,45,true);e.stun=Math.max(e.stun||0,.45);addFx('lightning',{x:target.x-34,y:target.y-380,tx:target.x,ty:target.y,color:'#a697c8',life:.3});addFx('scorch',{x:target.x,y:target.y,radius:26,color:'#3d3550',life:1.6});addFx('impact',{x:target.x,y:target.y,radius:25,color:'#a697c8',life:.35})}}}}

function usePulse(){if(gameMode==='erasers')return useReverseRage();if(paused||over||phase!=='wave')return;if(pulseCooldown>0){toast('Il soffio torna fra '+Math.ceil(pulseCooldown)+' secondi.');return}if(!tech.pulse||powerCharges.pulse<=0){toast('Nessuna carica di Soffio. Acquistala nel Laboratorio.');return false}powerCharges.pulse--;statAdd('powers');achCheck();pulseCooldown=32;runStats.pulses=(runStats.pulses||0)+1;for(let e of enemies){e.r+=38;e.stun=1.8;burst(CX+Math.cos(e.a)*e.r,CY+Math.sin(e.a)*e.r,'#b5ccc1',4)}rings.push({x:CX,y:CY,r:35,life:2,c:'#82aaa0'});addFx('pulseWave',{x:CX,y:CY,radius:(barriers.at(-1).r+150),color:'#6fa89c',life:.9});toast('Soffio! Le gomme arretrano.');sfx('complete');dock();ui()}
function saveBest(){best=Math.max(best,score);try{localStorage.setItem('ultimo-tratto-best',best)}catch(e){}persistMeta();achCheck();gcScores()}
function win(){recordRun(true);if(gameMode==='campaign'){statAdd('wins');unlock('win')}over=true;phase='won';saveBest();show(`<div class="eyebrow">IL DISEGNO È ANCORA QUI</div><h2>Hai resistito.</h2><p>${gameMode==='daily'?'Sfida del giorno completata':'Quaderno completato'} · ${kills} gomme fermate.<br><b>${score} punti</b> · Record ${best}<br>Livello ${playerLevel} · ${bossKills} boss sconfitti</p><button class="btn green" onclick="continueEndless()">Continua in endless →</button><button class="btn light" onclick="startGame()">Un nuovo foglio</button>`);dock()}
function continueEndless(){endless=true;recorded=false;over=false;phase='build';hide();dock();toast('Modalità endless: ogni ondata sarà più intensa.')}
function lose(){if(over)return;recordRun(false);core=0;over=true;phase='lost';saveBest();sfx('lose');show(`<div class="eyebrow">RIMANE SOLO LA CARTA</div><h2>L'ultimo segno.</h2><p>Hai raggiunto l’ondata ${wave} e fermato ${kills} gommine.<br><b>${score} punti</b> · Record ${best}<br>Livello ${playerLevel} · ${bossKills} boss sconfitti</p><button class="btn green" onclick="startGame()">Riprova su un nuovo foglio →</button><button class="btn light" onclick="guide()">Rileggi gli appunti</button>`);ui();dock()}
function catalogue(){visitPanel('catalogue',[selected]);if(selected<0)return;let header=`<div class="construction-heading"><h2>Costruisci</h2><span>Posto ${selected+1} · ${Math.floor(ink)}✎</span></div>`;show(`<div class="construction-list">${Object.entries(DEFENSES).sort(([a],[b])=>{let r=k=>k==='lab'?(labIndex()<0?0:50):(k==='triangle'||tech[k])?10:30;return r(a)-r(b)}).map(([key,d])=>{let reason=key==='lab'&&labIndex()>=0?'Laboratorio già costruito':key!=='triangle'&&key!=='lab'&&!tech[key]?'Ricerca: '+TECHNOLOGIES[key].name:ink<defenseCost(key)?'Grafite insufficiente':'';return labCard({name:d.name,figure:key,desc:d.desc+(d.range?' Gittata '+d.range+(d.damage?' · danno '+d.damage:'')+'.':''),cost:defenseCost(key),action:`purchaseTower('${key}')`,reason})}).join('')}</div>`,header)}
function purchaseTower(type){hide();build(type);selected=-1;dock()}
function build(type){if(type==='lab'&&labIndex()>=0){toast('Hai già un Laboratorio.');return false}if(type!=='triangle'&&type!=='lab'&&!tech[type]){toast('Prima completa la ricerca nel Laboratorio.');return false}if(selected<0||paused||over||towers[selected].type||!DEFENSES[type])return false;let d=DEFENSES[type],cost=defenseCost(type);if(ink<cost){toast('Serve più grafite');return false}ink-=cost;towers[selected].type=type;towers[selected].hp=towerMaxHP(towers[selected]);towers[selected].maxhp=towers[selected].hp;towers[selected].destroyed=false;towers[selected].branch=null;towers[selected].cooldown=.1;if(new Set(towers.filter(t=>t.type&&t.type!=='lab').map(t=>t.type)).size===5)unlock('variety');burst(slot(selected).x,slot(selected).y,d.color,12);sfx('build');statAdd('builds');achCheck();toast(t('{0} pronto.',d.name)+' '+d.desc);ui();dock();return true}
function defenseCost(type){return Math.round(DEFENSES[type].cost*(1-buildDiscount))}
function towerRange(t){return(gameMode!=='erasers'?paperProfile().range:0)+(t.branch==='nova'?45:0)+(DEFENSES[t.type]?.range||235)+(t.level-1)*15+rangeBonus}
function hurtEnemy(e,damage,pierce=false,kind=''){if(gameMode==='erasers'){hurtEraser(e,damage,pierce);return}if(e.dead)return;if(WET_KINDS.includes(kind)&&(e.slow>0||e.stun>0)&&!isBoss(e))damage*=1.25;let armor=e.armor||0;e.hp-=damage*(pierce?1:1-armor);e.flash=1;if(e.hp<=0){e.dead=true;kills++;statAdd('kills');gainXP(isBoss(e)?65:e.type==='mini'?3:e.type==='armored'?13:e.type==='splitter'?12:e.type==='fast'?9:8);if(isBoss(e)){bossKills++;statAdd('bosses');unlock('boss');addFx('bossDeath',{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r,radius:90,color:ENEMIES[e.type].color,life:1.3});shake=2}score+=isBoss(e)?180:e.type==='mini'?8:e.type==='fast'?25:30;ink=Math.min(MAXINK,ink+(isBoss(e)?24:e.type==='mini'?2:7));if(e.type==='splitter'){spawnEnemy('mini',e.a-.055,e.r+9);spawnEnemy('mini',e.a+.055,e.r+9)}let x=CX+Math.cos(e.a)*e.r,y=CY+Math.sin(e.a)*e.r;burst(x,y,e.type==='fast'?'#9bbdca':'#dba9aa',14);sfx('pop')}}
function updateDefenses(dt){for(let i=0;i<towers.length;i++){let t=towers[i];t.flash=Math.max(0,t.flash-dt*4);t.damageFlash=Math.max(0,(t.damageFlash||0)-dt*4);if(!towerOperational(t)||t.type==='lab')continue;t.cooldown-=dt;let p=slot(i),d=DEFENSES[t.type],range=towerRange(t);if(t.type==='mender'&&t.branch==='ward'){if(t.cooldown<=0&&ink>=3){let b=nearestBarrier(p),center=index(Math.atan2(p.y-CY,p.x-CX));patches.push({barrier:b.id,center,width:3,shield:45,life:6});ink-=3;t.cooldown=4;t.flash=1;addFx('seal',{x:CX+Math.cos(center/N*TAU)*b.r,y:CY+Math.sin(center/N*TAU)*b.r,radius:22,color:'#91ab78',life:.7})}continue}if(t.type==='mender'){if(t.cooldown<=0&&ink>1){let weakest=null;for(let b of barriers)for(let k=0;k<N;k++){let a=(k+.5)/N*TAU,q={x:CX+Math.cos(a)*b.r,y:CY+Math.sin(a)*b.r};if(b.hp[k]<90&&dist(p,q)<range&&(!weakest||b.hp[k]<weakest.hp))weakest={b,k,hp:b.hp[k],q}}if(weakest){let amount=Math.min(100-weakest.hp,12+t.level*6,ink/.04);weakest.b.hp[weakest.k]+=amount;ink-=amount*.04;if(t.branch==='stitch'){for(let extra of [-1,1]){let k=(weakest.k+extra+N)%N,healed=Math.min(100-weakest.b.hp[k],amount,Math.max(0,ink)/.04);weakest.b.hp[k]+=healed;ink-=healed*.04}}t.cooldown=1;t.flash=1;rings.push({x:weakest.q.x,y:weakest.q.y,r:4,life:.5,c:'#90aa72'});addFx('thread',{x:p.x,y:p.y,tx:weakest.q.x,ty:weakest.q.y,color:'#90aa72',life:.55});addFx('mend',{x:weakest.q.x,y:weakest.q.y,radius:18,color:'#90aa72',life:.65})}}continue}if(t.type==='octagon'){if(t.cooldown<=0&&ink>=2){let b=nearestBarrier(p),center=index(Math.atan2(p.y-CY,p.x-CX));patches.push({barrier:b.id,center,width:t.branch==='bastion'?10:6,shield:(55+t.level*20)*(t.branch==='bastion'?2:1),life:5});ink-=2;t.cooldown=d.rate;t.flash=1;addFx('seal',{x:CX+Math.cos(center/N*TAU)*b.r,y:CY+Math.sin(center/N*TAU)*b.r,radius:28,color:d.color,life:.6});if(t.branch==='rebound')addFx('shockwave',{x:p.x,y:p.y,radius:range,color:d.color,life:.5});if(t.branch==='rebound')for(let e of enemies)if(!e.dead&&dist(p,{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r})<range)hurtEnemy(e,18*damageMult,false)}continue}let nearby=enemies.filter(e=>!e.dead&&dist(p,{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r})<range);if(t.type==='pentagon'||t.type==='star'){if(t.cooldown<=0&&nearby.length&&ink>=.65){nearby.sort(targetOrder(t));let targets=[];if(t.type==='star')targets=nearby;else{let current=nearby[0];targets=[current];for(let hop=1;hop<(t.branch==='arc'?5:3);hop++){let from={x:CX+Math.cos(current.a)*current.r,y:CY+Math.sin(current.a)*current.r},next=nearby.find(e=>!targets.includes(e)&&dist(from,{x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r})<(t.branch==='arc'?150:105));if(!next)break;targets.push(next);current=next}}let origin=p;targets.forEach((e,j)=>{let q={x:CX+Math.cos(e.a)*e.r,y:CY+Math.sin(e.a)*e.r},damage=(d.damage+(t.level-1)*7)*damageMult*(t.branch==='nova'?1.25:1)*(t.type==='pentagon'?Math.pow(.8,j):1);hurtEnemy(e,damage,t.branch==='ion','pentagon');if(t.branch==='ion')e.stun=Math.max(e.stun||0,.45);if(t.branch==='ion')addFx('ionSpark',{x:q.x,y:q.y,radius:20,color:'#8f8af0',life:.4});if(t.branch==='comet')e.slow=Math.max(e.slow||0,1.5);if(t.branch==='comet')addFx('cometTrail',{x:p.x,y:p.y,tx:q.x,ty:q.y,color:'#e8a0b8',life:.35});addFx(t.type==='pentagon'?'lightning':'starRay',{x:origin.x,y:origin.y,tx:q.x,ty:q.y,color:d.color,life:.4});if(t.type==='pentagon')origin=q});if(t.type==='star')addFx('starBurst',{x:p.x,y:p.y,radius:range,color:d.color,life:.7});if(t.branch==='nova')addFx('shockwave',{x:p.x,y:p.y,radius:range,color:'#f4c9a0',life:.55});t.angle=Math.atan2(CY+Math.sin(nearby[0].a)*nearby[0].r-p.y,CX+Math.cos(nearby[0].a)*nearby[0].r-p.x);t.cooldown=d.rate/(1+(t.level-1)*.2);ink-=.65;t.flash=1}continue}if(t.type==='spiral'){if(nearby.length&&ink>.06){ink=Math.max(0,ink-dt*.45);nearby.forEach(e=>{e.slow=.2+t.level*.12;if(t.branch==='vortex'){let desired=Math.atan2(p.y-CY,p.x-CX),diff=Math.atan2(Math.sin(desired-e.a),Math.cos(desired-e.a));e.a+=Math.max(-.3*dt,Math.min(.3*dt,diff) function towerDetails(){visitPanel('tower',[selected]);let t=towers[selected];if(!t?.type)return;ensureTowerHealth(t);if(t.type==='lab'&&towerOperational(t)){labMenu();return}let d=DEFENSES[t.type],branch=t.branch?SPECIALIZATIONS[t.type]?.[t.branch]:null;show(`<div class="eyebrow keep">POSTAZIONE ${selected+1} · LIVELLO ${t.level}</div><div class="tower-portrait">${figureIcon(t.type,72)}</div><h2>${d.name}</h2>${drawingSpec(t)}${towerRepairButton(selected)}<p>${branch?branch.name+' · '+branch.desc:d.desc}</p>${t.type==='lab'&&researchJob?'<p>'+tt('Ricerca sospesa: {0}.',jobName())+' '+tt('Il tempo già investito è conservato.')+'</p>':''}${repairAllButton()}${!t.destroyed&&t.type!=='lab'?targetButton(selected):''}${!t.destroyed&&t.type!=='lab'&&t.level<3?upgradePreview(t):''}${!t.destroyed&&t.type!=='lab'&&t.level<3?`<button class="btn green" ${ink<(24+t.level*12)?'disabled':''} onclick="purchaseUpgrade()">${t.level===1?'Potenzia · 36✎':'Scegli evoluzione · 48✎'}</button>`:''}${t.type!=='lab'?`<button class="link-btn danger" onclick="if(this.dataset.s){hide();sellTower();selected=-1;dock()}else{this.dataset.s=1;this.textContent='Tocca ancora per cancellare'}">Cancella · recupera ${t.destroyed?0:Math.floor((15+(t.level-1)*12)*t.hp/t.maxhp)}✎</button>`:''}`)}

const SPARK_CAP=260;

function repairAt(p,dt){let d=Math.hypot(p.x-CX,p.y-CY),b=barriers.reduce((a,b)=>Math.abs(d-b.r)<Math.abs(d-a.r)?b:a,barriers[0]);if(!b||Math.abs(d-b.r)>35)return;let a=Math.atan2(p.y-CY,p.x-CX),i=index(a),used=0;for(let o=-2;o<=2;o++){let j=(i+o+N)%N,amount=Math.min(100-b.hp[j],dt*repairMult*(o===0?65:Math.abs(o)===1?45:20),Math.max(0,ink-2)/(.045*paperProfile().repair));if(amount>0){b.hp[j]+=amount;ink-=amount*.045*paperProfile().repair;used+=amount}}runStats.repairs=(runStats.repairs||0)+used;p.repairing=used>.01;if(p.repairing&&Math.random()<.4)burst(CX+Math.cos(a)*b.r,CY+Math.sin(a)*b.r,'#627d70',1)}

function beginCircle(){if(!tech.circles){labMenu('research');return}if(paused||over||phase!=='build')return;if(barriers.length>=3){toast('Hai già tre cerchi difensivi.');return}let radius=barriers.at(-1).r+80,cost=ringCost(radius);if(ink<cost){toast('Servono '+cost+' unità di grafite.');return}inputMode='draw';selected=-1;drawPreview={r:radius,cost};drawPath=[];drawPointer=null;pointers.clear();camera.zoom=.7;camera.panX=camera.panY=0;applyView();dock();toast('Segui il cerchio tratteggiato e richiudi il tratto.')}

const SPR={};if(typeof Image!=='undefined')for(const k in SPRD){const im=new Image();im.src='data:image/webp;base64,'+SPRD[k].d;SPR[k]=im}
const sprOK=k=>{const i=SPR[k];return !!(i&&i.complete&&i.naturalWidth)};
function drawSpr(k,x,y,tw,flip,rot,lift,glow){const i=SPR[k];if(!sprOK(k))return false;let s=tw/i.naturalWidth,w=i.naturalWidth*s,h=i.naturalHeight*s;ctx.save();ctx.translate(x,y);ctx.scale(1,1/TILT);if(rot)ctx.rotate(rot);ctx.scale(flip?-1:1,1);ctx.drawImage(i,-w/2,-h*.6-(lift||0),w,h);if(glow){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=glow;ctx.drawImage(i,-w/2,-h*.6-(lift||0),w,h)}ctx.restore();return true}
const TOWER_SPR_W={triangle:62,spiral:56,mortar:56,sniper:68,mender:60,pentagon:60,star:64,octagon:58,lab:68},TOWER_FLIP={triangle:1,mortar:1,sniper:1};
function towerSprite(t,pr){let k='d_'+t.type;if(!sprOK(k))return false;let a=t.angle==null?-Math.PI/2:t.angle,lv=t.level||1,tw=TOWER_SPR_W[t.type]*(1+.07*(lv-1));

 if(lv>1){ctx.save();ctx.strokeStyle=lv>=3?'#d9bb68':'#cfd9dd';ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(0,0,tw*.46,tw*.4,0,0,TAU);ctx.stroke();ctx.restore()}
 drawSpr(k,0,tw*.12,tw,TOWER_FLIP[t.type]&&Math.cos(a)<0,0,0,t.flash>0?Math.min(.5,t.flash*.5):0);
 if(t.type==='lab'&&pr!=null){ctx.save();ctx.translate(0,-tw*.5);ctx.scale(1,1/TILT);ctx.fillStyle='rgba(255,250,235,.85)';ctx.strokeStyle='#4a444e';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(-16,-4,32,7,3.5);ctx.fill();ctx.stroke();ctx.fillStyle='#d9a441';ctx.beginPath();ctx.roundRect(-15,-3,30*pr,5,2.5);ctx.fill();ctx.restore()}

function eraserSprite(e,x,y,ang){let m=ERASER_SPR[e.type];if(!m||!sprOK(m[0]))return false;let tw=m[1]*(e.avatar?1.25:1),bob=Math.abs(Math.sin(clock*6+(e.wobble||0)))*2.2;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(38,48,42,.2)';ctx.beginPath();ctx.ellipse(tw*.08,tw*.06,tw*.4,tw*.17,0,0,TAU);ctx.fill();ctx.restore();return drawSpr(m[0],x,y+tw*.1,tw,Math.cos(e.a)<0,ang-(e.a+Math.PI/2),bob,e.flash>0?Math.min(.5,e.flash*.5):0)}
let PAPERY=false;
function prism(pts,h,col,alpha=1,sh=1){let ga=ctx.globalAlpha;ctx.lineJoin='round';ctx.lineWidth=PAPERY?1:1.3;ctx.strokeStyle=PAPERY?'rgba(74,68,78,.8)':'#4a4650';ctx.globalAlpha=ga*alpha;
 let order=pts.map((a,k)=>{let b=pts[(k+1)%pts.length],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;return{a,b,nx:dy/L,ny:-dx/L}}).filter(f=>f.ny>-.15).sort((p,q)=>p.ny-q.ny);

function fitView(){camera.zoom=1;camera.panX=camera.panY=0;applyView()}

function resetContacts(){avatarTarget=null;contacts.clear();pointers.clear();transformState=null;gestureLocked=false;drawPointer=null;drawPath=[];$('gestureHint').classList.remove('visible')}
function beginTransform(){let a=[...contacts.values()];if(a.length<2)return;let p=a[0].screen,q=a[1].screen,mid={x:(p.x+q.x)/2,y:(p.y+q.y)/2};transformState={distance:Math.max(1,dist(p,q)),zoom:camera.zoom,anchor:{x:(mid.x-view.x)/view.scale,y:(mid.y-view.y)/view.scale}};gestureLocked=true;avatarTarget=null;pointers.clear();drawPath=[];drawPointer=null;$('gestureHint').textContent='Due dita · sposta e ingrandisci';$('gestureHint').classList.add('visible')}
function moveTransform(){if(!transformState||contacts.size<2)return;let a=[...contacts.values()],p=a[0].screen,q=a[1].screen,mid={x:(p.x+q.x)/2,y:(p.y+q.y)/2};camera.zoom=Math.max(.55,Math.min(2.2,transformState.zoom*dist(p,q)/transformState.distance));let scale=camera.base*camera.zoom;camera.panX=Math.max(-W,Math.min(W,mid.x-camera.cx+(CX-transformState.anchor.x)*scale));camera.panY=Math.max(-H,Math.min(H,mid.y-camera.cy+(CY-transformState.anchor.y)*scale));applyView()}
function openRepairTools(){visitPanel('tools',[]);show(`<div class="eyebrow">LA TUA MATITA</div><h2>Come ripari?</h2><div class="repair-options">${Object.entries(REPAIR_TOOLS).map(([k,t])=>`<button class="choice ${repairTool===k?'selected':''}" onclick="selectRepairTool('${k}')"><b>${t.icon} ${t.name}</b><small>${k!=='pencil'&&!tech[k]?'⌁ Richiedi questa ricerca al Laboratorio. ':''}${t.desc}</small></button>`).join('')}</div><button class="btn light" onclick="backPanel()">Indietro</button>`)}
function selectRepairTool(tool){if(!REPAIR_TOOLS[tool])return;if(tool!=='pencil'&&!tech[tool]){labMenu('research');return}repairTool=tool;hide();dock();toast(REPAIR_TOOLS[tool].desc)}
function nearestBarrier(p){let radius=Math.hypot(p.x-CX,p.y-CY);return barriers.reduce((a,b)=>Math.abs(b.r-radius)<Math.abs(a.r-radius)?b:a,barriers[0])}
function useRepairTool(start,end=start){if(repairTool!=='pencil'&&!tech[repairTool]){toast('Prima completa la ricerca.');return false}let b=nearestBarrier(end);if(!b||Math.abs(Math.hypot(end.x-CX,end.y-CY)-b.r)>Math.max(30,20/view.scale)){toast('Agisci sul contorno di un cerchio.');return false}let center=index(Math.atan2(end.y-CY,end.x-CX));if(repairTool==='patch'){if(ink<12){toast('Servono 12✎ per la toppa.');return false}if(patches.some(p=>p.barrier===b.id&&Math.abs(Math.atan2(Math.sin((p.center-center)*TAU/N),Math.cos((p.center-center)*TAU/N)))<.15)){toast('Questo tratto ha già una toppa.');return false}ink-=12;patches.push({barrier:b.id,center,width:4,shield:140,life:10*paperProfile().duration});burst(CX+Math.cos(center/N*TAU)*b.r,CY+Math.sin(center/N*TAU)*b.r,'#b4c7a5',10);toast('Toppa applicata · '+(10*paperProfile().duration)+' secondi');sfx('repair');ui();return true}if(repairTool==='stitch'){let begin=index(Math.atan2(start.y-CY,start.x-CX)),delta=((center-begin+N*1.5)%N)-N/2,indices=[];if(Math.abs(delta)>14){toast('Cuci una breccia più corta.');return false}if(Math.abs(delta)<2){for(let j=-3;j<=3;j++)indices.push((center+j+N)%N)}else{let direction=Math.sign(delta);for(let j=0;j<=Math.abs(delta);j++)indices.push((begin+j*direction+N)%N)}let dir=indices.length>1&&((indices[1]-indices[0]+N)%N)===1?1:-1,before=(indices[0]-dir+N)%N,after=(indices.at(-1)+dir+N)%N;if(!indices.some(i=>b.hp[i]<20)||b.hp[before]<20||b.hp[after]<20){toast('Serve una breccia con due estremità sane.');return false}if(ink<8){toast('Servono 8✎ per la cucitura.');return false}ink-=8;for(let i of indices)b.hp[i]=Math.max(65,b.hp[i]);stitches.push({barrier:b.id,indices,life:8});toast('Breccia ricucita.');sfx('repair');ui();return true}return false}
function erodeSegment(b,k,amount){if(sealTime>0)amount*=.35;for(let p of patches){let d=Math.abs(((k-p.center+N*1.5)%N)-N/2);if(p.barrier===b.id&&p.life>0&&d<=p.width&&p.shield>0){let absorb=Math.min(p.shield,amount);p.shield-=absorb;amount-=absorb;if(amount<=0)return}}b.hp[k]=Math.max(0,b.hp[k]-amount*paperProfile().fragile)}

function coords(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.scale,y:CY+((e.clientY-r.top-view.y)/view.scale-CY)/TL()}}
cv.onpointerdown=e=>{if(mixedTouchLock||!started||(paused&&!pendingAlly)||over)return;e.preventDefault();cv.setPointerCapture(e.pointerId);let screen=screenPoint(e),world=coords(e);contacts.set(e.pointerId,{screen,start:screen,world,startWorld:world,moved:0,tower:-1});if(contacts.size>=2){beginTransform();return}if(gestureLocked)return;if(gameMode==='erasers'){if(pendingAlly)chooseAllyPoint(world);else avatarTarget=world;return}if(inputMode==='draw'){drawPointer=e.pointerId;drawPath=[world];return}let contact=contacts.get(e.pointerId);for(let i=towers.length-1;i>=0;i--)if(dist(world,slot(i))<Math.min(38,Math.max(30,23/view.scale))){contact.tower=i;return}if(repairTool==='pencil')pointers.set(e.pointerId,{...world,delay:.08});};
cv.onpointermove=e=>{let contact=contacts.get(e.pointerId);if(!contact||(paused&&!pendingAlly))return;contact.screen=screenPoint(e);contact.moved=Math.max(contact.moved,dist(contact.screen,contact.start));if(contacts.size>=2){moveTransform();return}if(gestureLocked)return;let world=coords(e);contact.world=world;if(gameMode==='erasers'){if(pendingAlly)chooseAllyPoint(world);else avatarTarget=world;return}if(inputMode==='draw'&&drawPointer===e.pointerId){if(dist(world,drawPath.at(-1))>3)drawPath.push(world);return}if(repairTool==='pencil'&&contact.tower<0){let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{...world,delay:old?.delay||0})}};
function release(e){let contact=contacts.get(e.pointerId);if(!contact)return;let consumed=gestureLocked||contacts.size>=2;pointers.delete(e.pointerId);contacts.delete(e.pointerId);if(!consumed&&!paused&&!over&&gameMode!=='erasers'){if(inputMode==='draw'&&drawPointer===e.pointerId)finishCircle();else if(contact.tower>=0&&contact.moved<12){let again=selected===contact.tower;selected=contact.tower;dock();if(!towers[selected].type)catalogue();else if(again)towerDetails();else radialUpdate();sfx('tap')}else if(repairTool!=='pencil'&&contact.tower<0)useRepairTool(contact.startWorld,contact.world);else if(contact.moved<10&&selected>=0){selected=-1;dock()}}if(contacts.size===0){transformState=null;gestureLocked=false;$('gestureHint').classList.remove('visible');drawPointer=null}else if(contacts.size>=2)beginTransform()}
cv.onpointerup=release;cv.onpointercancel=e=>{pointers.delete(e.pointerId);contacts.delete(e.pointerId);drawPath=[];drawPointer=null;if(!contacts.size){transformState=null;gestureLocked=false;$('gestureHint').classList.remove('visible')}};cv.onlostpointercapture=e=>{if(contacts.has(e.pointerId))cv.onpointercancel(e)};
cv.addEventListener('wheel',e=>{if(paused||!started||over)return;e.preventDefault();if(e.ctrlKey||e.metaKey){let p=screenPoint(e),anchor={x:(p.x-view.x)/view.scale,y:(p.y-view.y)/view.scale};camera.zoom=Math.max(.55,Math.min(2.2,camera.zoom*Math.exp(-e.deltaY*.008)));let scale=camera.base*camera.zoom;camera.panX=p.x-camera.cx+(CX-anchor.x)*scale;camera.panY=p.y-camera.cy+(CY-anchor.y)*scale}else{camera.panX=Math.max(-W,Math.min(W,camera.panX-e.deltaX));camera.panY=Math.max(-H,Math.min(H,camera.panY-e.deltaY))}applyView()},{passive:false});
// Safari can ignore viewport limits: explicitly block native scale gestures.
function blockPageZoom(e){if(e.cancelable)e.preventDefault()}
for(let name of ['gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(name,blockPageZoom,{passive:false,capture:true});
let mixedTouchLock=false;
function guardTouches(e){let touches=Array.from(e.touches||[]),onField=started&&!over&&(!paused||!!pendingAlly)&&touches.every(t=>t.target===cv);if(touches.length>1&&!onField){mixedTouchLock=true;resetContacts();gestureLocked=true;blockPageZoom(e)}else if(mixedTouchLock){blockPageZoom(e);if(!touches.length){mixedTouchLock=false;resetContacts()}}}
for(let name of ['touchstart','touchmove','touchend','touchcancel'])document.addEventListener(name,guardTouches,{passive:false,capture:true});
// Ctrl+wheel must never scale home or panels. Field zoom uses the camera handler.
document.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)blockPageZoom(e)},{passive:false,capture:true});
window.addEventListener('blur',()=>{mixedTouchLock=false;saveRun();resetContacts();if(started&&!paused&&!over)pauseGame()});document.addEventListener('visibilitychange',()=>{if(document.hidden){mixedTouchLock=false;resetContacts();saveRun();if(started&&!paused&&!over)pauseGame()}});window.addEventListener('keydown',e=>{if(e.code==='Escape')pauseGame();if(e.code==='KeyF'&&!e.repeat)usePulse();if(e.code==='Space'&&!e.repeat&&phase==='build'){e.preventDefault();startWave()}});
function toggleSound(){setPref('sound',!soundOn,true)}
function sfx(type){hapticFor(type);if(!soundOn||!audio||prefs.volume<=0)return;try{let o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime,f={shoot:650,pop:240,hit:100,breach:130,build:480,complete:680,start:420,wave:220,repair:330,lose:90,tap:460}[type]||300;o.type=type==='shoot'?'triangle':'sine';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*(type==='complete'?1.8:.5)),now+.12);g.gain.setValueAtTime((type==='shoot'?.018:.045)*(prefs.volume/70),now);g.gain.exponentialRampToValueAtTime(.001,now+.16);o.connect(g);g.connect(audio.destination);o.start();o.stop(now+.17)}catch(e){}}
let radialLast='',radialSell=-1,radialSellAt=0,radialW=0,radialPos='';
function radialActive(){return started&&!over&&!paused&&gameMode!=='erasers'&&inputMode!=='draw'&&!pendingAlly&&selected>=0&&!!towers[selected]?.type}
function radialBtn(act,icon,label,aria,cls='',off=false){return `<button class="radial-btn ${cls}" ${off?'disabled':''} aria-label="${aria}" title="${aria}" onclick="radialDo('${act}')"><span>${icon}</span><small>${label}</small></button>`}
function radialHtml(){let t=towers[selected];ensureTowerHealth(t);let d=DEFENSES[t.type],b='';
if(t.type==='lab'){if(towerOperational(t))b+=radialBtn('lab','⌂','Lab','Apri Laboratorio','ok')}
else if(!t.destroyed&&t.level<3){let c=24+t.level*12;b+=radialBtn('up','▲',c+'✎',t.level===2?'Scegli evoluzione':'Potenzia','ok',t.level<2&&ink<c)}
let rc=towerRepairCost(t);if(rc>0)b+=radialBtn('heal','✚',rc+'✎','Cura','',ink<rc);
if(damagedDefenses().length>=2)b+=radialBtn('all','✚✚',repairAllCost()+'✎','Cura tutto','',ink<1);
if(!t.destroyed&&['triangle','mortar','sniper','pentagon'].includes(t.type)){let m=TARGET_MODES.find(m=>m[0]===(t.priority||'first'))||TARGET_MODES[0];b+=radialBtn('aim','◎',m[1],'Mira: '+m[1])}
b+=radialBtn('info','ⓘ','Dettagli','Dettagli');
if(t.type!=='lab'){let armed=radialSell===selected&&performance.now()-radialSellAt<3000;b+=radialBtn('sell','<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>',armed?'Conferma':'+'+(t.destroyed?0:Math.floor((15+(t.level-1)*12)*t.hp/t.maxhp))+'✎','Cancella','danger'+(armed?' armed':''))}
return `<div class="radial-cap">${d.name} · Livello ${t.level}</div><div class="radial-bar" role="group" aria-label="Azioni della difesa">${b}</div>`}
function radialDo(a){if(!radialActive())return;let i=selected;sfx('tap');
if(a==='up'){upgradeTower();dock()}else if(a==='heal')repairTower(i,true);else if(a==='all')repairAll(true);else if(a==='aim')cycleTarget(i,true);else if(a==='info')towerDetails();else if(a==='lab')labMenu();
else if(a==='sell'){if(radialSell===i&&performance.now()-radialSellAt<3000){radialSell=-1;sellTower();if(!towers[i].type){selected=-1;dock()}}else{radialSell=i;radialSellAt=performance.now()}}
radialUpdate()}
function radialUpdate(){let el=$('radial');if(!el)return;if(!radialActive()){if(radialLast){radialLast='';radialPos='';el.innerHTML='';el.classList.remove('on')}return}
let h=radialHtml();if(h!==radialLast){radialLast=h;el.innerHTML=h;el.classList.add('on');radialW=el.offsetWidth||0;radialPos=''}
let p=slot(selected),sx=view.x+p.x*view.scale,sy=view.y+(CY+(p.y-CY)*TL())*view.scale,cyS=view.y+CY*view.scale,half=(radialW||220)/2,left=Math.max(half+6,Math.min(W-half-6,sx)),below=sy<cyS,off=26*Math.min(1.3,view.scale)+8,key=Math.round(left)+','+Math.round(sy)+','+below;
if(key!==radialPos){radialPos=key;el.style.left=left+'px';if(below){el.style.top=(sy+off)+'px';el.style.bottom='auto'}else{el.style.bottom=(H-sy+off)+'px';el.style.top='auto'}}}
function frame(t){let dt=Math.max(0,Math.min(.04,(t-last)/1000||0));last=t;update(dt*gameSpeed);paperWarmth+=(paperAgeValue()-paperWarmth)*(1-Math.exp(-dt*1.8));draw();radialUpdate();requestAnimationFrame(frame)}init();phase='intro';ui();intro();requestAnimationFrame(frame);

GC.enabled=prefs.gc!==false;GC.onSync=()=>{achSent={};achCheck(true);gcScores()};if(GC.enabled)GC.send({type:'ready',version:1});achCheck(true);gcScores();
i18nApply();
</script></body></html>
