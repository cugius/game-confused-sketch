name: ConfusedSketch
options:
  bundleIdPrefix: com.confusedbyme
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.14.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ConfusedSketch:
    type: application
    platform: iOS
    sources:
      - path: ConfusedSketch
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.confusedbyme.sketch
        INFOPLIST_FILE: ConfusedSketch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ConfusedSketch/ConfusedSketch.entitlements
      properties:
        com.apple.developer.game-center: true
    scheme:
      gatherCoverageData: false
